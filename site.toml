[theme]
# Each key becomes a CSS variable (--bg, --panel, ...). See the top of
# theme/style.css for the full list and defaults.
bg = "#f7d1cd"
bg-2 = "#e8c2ca"
panel = "#fffaf6"
accent = "#735d78"
accent-2 = "#b392ac"
accent-ink = "#f7d1cd"
